name: News Summary Notification

on:
  schedule:
    # 毎朝 7:00 JST (= UTC 22:00 前日) に実行
    - cron: "0 22 * * *"
    # 毎夕 19:00 JST (= UTC 10:00) に実行
    - cron: "0 10 * * *"

  # 手動でも実行できるようにする（テスト用）
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic httpx

      - name: Run news summary script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python news_summary.py
